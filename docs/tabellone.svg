<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" font-family="Inconsolata, Consolas, Menlo, monospace">
  <defs>
    <pattern id="led" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000" opacity="0"/>
      <rect x="3" width="1" height="4" fill="#0c0c0e" opacity="0.55"/>
      <rect y="3" width="4" height="1" fill="#0c0c0e" opacity="0.55"/>
    </pattern>
    <style>
      .riga { opacity: 0; animation: giro 12s infinite; }
      .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
      @keyframes giro { 0%{opacity:0} 3%{opacity:1} 30%{opacity:1} 33%{opacity:0} 100%{opacity:0} }
      .punto { animation: lamp 1s steps(1) infinite; } .p2 { animation-delay: .5s; }
      @keyframes lamp { 0%{opacity:1} 50%{opacity:0} }
      .t { fill: #ffa51e; font-weight: 700; }
      .h { fill: #e8e9ee; font-family: Segoe UI, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="760" height="150" rx="10" fill="#0c0c0e"/>
  <rect x="8" y="8" width="744" height="134" rx="6" fill="#141418"/>
  <text x="26" y="38" class="h" font-size="18" font-weight="700">Partenze</text>
  <text x="112" y="38" class="h" font-size="15" opacity="0.6">Departures</text>
  <g class="h" font-size="11" opacity="0.7">
    <text x="26" y="62">treno</text><text x="150" y="62">destinazione</text><text x="470" y="62">orario</text><text x="640" y="62">binario</text>
  </g>
  <rect x="18" y="72" width="724" height="44" rx="3" fill="#1d1d22"/>
  <g class="riga r1" font-size="22">
    <text x="26" y="102" class="t">REG 7785</text><text x="150" y="102" class="t">TORINO LINGOTTO</text><text x="470" y="102" class="t">17:02</text><text x="652" y="102" class="t">19</text>
  </g>
  <g class="riga r2" font-size="22">
    <text x="26" y="102" class="t">RV  5475</text><text x="150" y="102" class="t">ASTI</text><text x="470" y="102" class="t">18:15</text><text x="652" y="102" class="t">13</text>
  </g>
  <g class="riga r3" font-size="22">
    <text x="26" y="102" class="t">MERCI</text><text x="150" y="102" class="t">ALESSANDRIA</text><text x="470" y="102" class="t">18:40</text><text x="640" y="102" class="t">DEP</text>
  </g>
  <circle class="punto" cx="700" cy="94" r="5" fill="#ffa51e"/>
  <circle class="punto p2" cx="718" cy="94" r="5" fill="#ffa51e"/>
  <text x="26" y="134" class="t" font-size="13" opacity="0.85">E' VIETATO OLTREPASSARE LA LINEA GIALLA</text>
  <rect x="18" y="72" width="724" height="70" fill="url(#led)"/>
</svg>
